<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldBuilder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23ebe3cf%22/%3E%3Cpath d=%22M2 12 L7 4 L9 8 L11 6 L14 12 Z%22 fill=%22none%22 stroke=%22%232a2219%22 stroke-width=%221.3%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar">
        <span class="app-name">WorldBuilder</span>
        <div class="menu">
          <button class="menu-title">File</button>
          <div class="menu-items">
            <button data-cmd="new">New map</button>
            <button data-cmd="open">Open…<kbd>Ctrl+O</kbd></button>
            <button data-cmd="sample">Open sample map</button>
            <hr />
            <button data-cmd="save">Save…<kbd>Ctrl+S</kbd></button>
            <hr />
            <button data-cmd="export-svg">Export as SVG</button>
            <button data-cmd="export-png">Export as PNG</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-title">Edit</button>
          <div class="menu-items">
            <button data-cmd="undo">Undo<kbd>Ctrl+Z</kbd></button>
            <button data-cmd="redo">Redo<kbd>Ctrl+Y</kbd></button>
            <hr />
            <button data-cmd="delete">Delete selection<kbd>Del</kbd></button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-title">View</button>
          <div class="menu-items" id="view-menu">
            <button data-cmd="proj:orthographic">Globe</button>
            <button data-cmd="proj:equalEarth">Equal Earth</button>
            <button data-cmd="proj:naturalEarth">Natural Earth</button>
            <button data-cmd="proj:equirectangular">Equirectangular</button>
            <button data-cmd="proj:mercator">Mercator</button>
            <hr />
            <button data-cmd="style:parchment">Parchment</button>
            <button data-cmd="style:atlas">Atlas</button>
            <button data-cmd="style:ink">Pen &amp; ink</button>
            <hr />
            <button data-cmd="tooltable">Tools on the table</button>
            <hr />
            <button data-cmd="graticule">Graticule</button>
            <button data-cmd="scalebar">Scale bar</button>
            <button data-cmd="reset-view">Reset view</button>
          </div>
        </div>
        <span class="spacer"></span>
      </nav>

      <div id="toolbox">
        <div class="tray">
        <button class="tool" data-tool="select" title="Select &amp; edit (V)"><kbd>V</kbd>
        </button>
        <button class="tool" data-tool="hand" title="Hand (H)"><kbd>H</kbd>
        </button>
        </div>
        <div class="tray">
        <button class="tool" data-tool="land" title="Land pen (L)"><kbd>L</kbd>
        </button>
        <button class="tool" data-tool="cut" title="Water pen: lakes and bays (W)"><kbd>W</kbd>
        </button>
        <button class="tool" data-tool="river" title="River pen (R)"><kbd>R</kbd>
        </button>
        <button class="tool" data-tool="border" title="Border pen (B)"><kbd>B</kbd>
        </button>
        <button class="tool" data-tool="forest" title="Vegetation: forests, jungle, scrub, grass (F)"><kbd>F</kbd></button>
        <button class="tool" data-tool="mountains" title="Mountain range (M)"><kbd>M</kbd></button>
        <button class="tool" data-tool="relief" title="Elevation: raise or lower land, ridges and valleys (E)"><kbd>E</kbd></button>
        </div>
        <div class="tray">
        <button class="tool" data-tool="stamp" title="Symbol stamp (S)"><kbd>S</kbd>
        </button>
        <button class="tool" data-tool="text" title="Text (T)"><kbd>T</kbd>
        </button>
        </div>
        <button class="modeswitch" data-cmd="tooltable" title="Lay the tools out on the table">Table</button>
      </div>

      <main id="viewport">
        <input id="text-editor" type="text" spellcheck="false" class="hidden" />
        <div id="tabletools"></div>
      </main>

      <aside id="props"></aside>

      <footer id="status">
        <span id="hint"></span>
        <span class="coords"><span id="coords"></span><span id="zoom"></span></span>
      </footer>
    </div>
    <dialog id="new-map">
      <form method="dialog">
        <h3>New map</h3>
        <div class="row"><span>Planet</span><select id="nm-preset"></select></div>
        <div class="row"><span>Radius</span><span class="inline"><input id="nm-radius" type="number" min="100" max="200000" step="1" /> km</span></div>
        <p class="note" id="nm-info"></p>
        <p class="note">The planet's size sets real distances on the map, shown by the scale bar. You can change it later in the Map panel.</p>
        <div class="buttons dialog-buttons">
          <button class="btn" value="cancel">Cancel</button>
          <button class="btn primary" value="create">Create map</button>
        </div>
      </form>
    </dialog>
    <input id="file-input" type="file" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
